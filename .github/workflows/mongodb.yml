name: MongoDB

on:
  workflow_dispatch:
  schedule:
    # 每周一北京时间 03:00 执行 MongoDB 集成回归。
    - cron: "0 19 * * 0"

permissions:
  contents: read

concurrency:
  group: mongodb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Linux MongoDB 8.0
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libtool ninja-build

      - name: 配置 skyuv
        run: cmake --preset linux-gcc-debug

      - name: 构建便携 Skynet
        run: >-
          cmake --build --preset linux-gcc-debug --target
          skyuv_skynet_portable skyuv_portable_service_snlua
          skyuv_portable_service_logger skyuv_portable_service_harbor
          skyuv_portable_lua_module_skynet skyuv_portable_lua_module_bson

      - name: 运行 MongoDB 集成测试
        run: |
          timeout 30s \
            build/linux-gcc-debug/src/skyuv_skynet_portable \
            build/linux-gcc-debug/3rd/skyuv-portable-mongo-integration.conf \
            2>&1 | tee skyuv-mongodb.log
          grep -F "skyuv MongoDB CRUD 与索引验证通过" skyuv-mongodb.log

      - name: 检查第三方源码状态
        run: test -z "$(git -C 3rd/skynet status --short)"
