name: macOS

on:
  workflow_dispatch:
  schedule:
    # 每周一北京时间 02:00 执行完整矩阵。
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Clang Debug
            preset: macos-clang-debug
          - name: Apple Clang Release
            preset: macos-clang-release

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 配置 skyuv
        run: cmake --preset "${{ matrix.preset }}"

      - name: 构建平台层与 Actor 基础子集
        run: >-
          cmake --build --preset "${{ matrix.preset }}" --target
          uv_a cmocka skyuv_lua skyuv_skynet_portable_core skyuv_socket_core
          skyuv_test_lua skyuv_test_allocator skyuv_test_thread
          skyuv_test_time skyuv_test_dynamic skyuv_test_atomic
          skyuv_test_socket_internal
          skyuv_skynet_portable skyuv_portable_service_logger
          skyuv_portable_service_snlua skyuv_portable_service_harbor
          skyuv_portable_service_gate
          skyuv_portable_lua_module_control skyuv_portable_lua_module_skynet
          skyuv_portable_lua_module_bson

      - name: 运行测试
        run: ctest --preset "${{ matrix.preset }}"

      - name: 验证 SIGTERM 正常停止
        run: >-
          python3 tests/scripts/process_shutdown.py
          "build/${{ matrix.preset }}/src/skyuv_skynet_portable"
          "build/${{ matrix.preset }}/3rd/skyuv-portable-process-shutdown.conf"
