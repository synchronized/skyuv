name: Linux

on:
  workflow_dispatch:
  schedule:
    # 每周一北京时间 02:00 执行完整矩阵。
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            compiler: gcc
            preset: linux-gcc-debug
          - name: Clang Debug
            compiler: clang
            preset: linux-clang-debug
          - name: GCC Release
            compiler: gcc
            preset: linux-gcc-release
          - name: Clang Release
            compiler: clang
            preset: linux-clang-release
          - name: GCC System Allocator Debug
            compiler: gcc
            preset: linux-gcc-system-debug

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libtool ninja-build

      - name: 配置 skyuv
        run: cmake --preset "${{ matrix.preset }}"

      - name: 构建 skyuv Linux 基线
        run: >-
          cmake --build --preset "${{ matrix.preset }}" --target
          uv_a cmocka skyuv_lua skyuv_skynet skyuv_service_snlua
          skyuv_service_logger skyuv_service_harbor skyuv_lua_module_skynet
          skyuv_skynet_portable skyuv_portable_service_snlua
          skyuv_portable_service_logger skyuv_portable_service_harbor
          skyuv_portable_lua_module_skynet skyuv_portable_lua_module_client
          skyuv_lua_module_client skyuv_socket_core skyuv_test_socket_internal
          skyuv_test_lua skyuv_test_allocator skyuv_test_thread skyuv_test_time
          skyuv_test_dynamic skyuv_test_atomic

      - name: 运行 skyuv 测试
        run: ctest --preset "${{ matrix.preset }}"

      - name: 运行 CMake 版 Skynet 启动测试
        shell: bash
        run: |
          set +e
          timeout 5s "build/${{ matrix.preset }}/3rd/skynet" \
            "build/${{ matrix.preset }}/3rd/skyuv-smoke.conf" 2>&1 | tee skyuv-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          grep -F "skyuv CMake 启动验证通过" skyuv-smoke.log

      - name: 运行 CMake 版 Skynet TCP echo 测试
        shell: bash
        run: |
          timeout 10s "build/${{ matrix.preset }}/3rd/skynet" \
            "build/${{ matrix.preset }}/3rd/skyuv-echo.conf" >skyuv-echo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 tests/echo_client.py | tee "$RUNNER_TEMP/cmake-echo-result.txt"
          grep -F "skyuv echo 已就绪" skyuv-echo.log
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" || true
          trap - EXIT

      - name: 运行 CMake 版 TCP 原始事件基线
        shell: bash
        run: |
          timeout 15s "build/${{ matrix.preset }}/3rd/skynet" \
            "build/${{ matrix.preset }}/3rd/tcp-events.conf" \
            2>&1 | tee cmake-tcp-events.log
          grep -F "skyuv TCP 原始事件基线验证通过" cmake-tcp-events.log

      - name: 运行消息、定时器与关闭基线测试
        shell: bash
        run: |
          set +e
          timeout 10s "build/${{ matrix.preset }}/3rd/skynet" \
            "build/${{ matrix.preset }}/3rd/skyuv-baseline.conf" \
            >skyuv-baseline.log 2>&1
          status=$?
          set -e
          cat skyuv-baseline.log
          if [[ $status -ne 0 ]]; then
            exit $status
          fi
          message_line=$(grep -nF "skyuv Actor 消息验证通过" skyuv-baseline.log | head -1 | cut -d: -f1)
          timer_line=$(grep -nF "skyuv 定时器验证通过" skyuv-baseline.log | head -1 | cut -d: -f1)
          shutdown_line=$(grep -nF "skyuv 正常关闭验证开始" skyuv-baseline.log | head -1 | cut -d: -f1)
          test "$message_line" -lt "$timer_line"
          test "$timer_line" -lt "$shutdown_line"

      - name: 复制原版 Skynet 到临时目录
        run: cmake -E copy_directory 3rd/skynet "$RUNNER_TEMP/skynet"

      - name: 构建原版 Skynet
        working-directory: ${{ runner.temp }}/skynet
        run: make linux CC="${{ matrix.compiler }}" -j2

      - name: 准备原版 Skynet echo 环境
        run: |
          cmake -E copy tests/fixtures/skyuv_echo.lua "$RUNNER_TEMP/skynet/service/skyuv_echo.lua"
          cmake -E copy tests/fixtures/skyuv_tcp_events.lua "$RUNNER_TEMP/skynet/service/skyuv_tcp_events.lua"
          cmake -E copy tests/fixtures/skyuv_socket_controls.lua "$RUNNER_TEMP/skynet/service/skyuv_socket_controls.lua"
          cmake -E copy tests/fixtures/skyuv_udp_events.lua "$RUNNER_TEMP/skynet/service/skyuv_udp_events.lua"
          cmake -E copy tests/fixtures/skyuv_client_socket.lua "$RUNNER_TEMP/skynet/service/skyuv_client_socket.lua"
          cmake -E copy examples/upstream-echo.conf "$RUNNER_TEMP/skynet/examples/skyuv-echo.conf"
          cmake -E copy examples/upstream-tcp-events.conf "$RUNNER_TEMP/skynet/examples/tcp-events.conf"
          cmake -E copy examples/upstream-socket-controls.conf "$RUNNER_TEMP/skynet/examples/socket-controls.conf"
          cmake -E copy examples/upstream-udp-events.conf "$RUNNER_TEMP/skynet/examples/udp-events.conf"
          cmake -E copy examples/upstream-client-socket.conf "$RUNNER_TEMP/skynet/examples/client-socket.conf"

      - name: 运行原版 client.socket 行为基线
        shell: bash
        run: |
          python3 tests/scripts/client_socket_harness.py \
            "$RUNNER_TEMP/skynet/skynet" examples/client-socket.conf \
            --cwd "$RUNNER_TEMP/skynet" | tee "$RUNNER_TEMP/upstream-client-socket.txt"

      - name: 运行原版 Skynet TCP echo 对照测试
        working-directory: ${{ runner.temp }}/skynet
        shell: bash
        run: |
          timeout 10s ./skynet examples/skyuv-echo.conf >upstream-echo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 "$GITHUB_WORKSPACE/tests/echo_client.py" \
            | tee "$RUNNER_TEMP/upstream-echo-result.txt"
          grep -F "skyuv echo 已就绪" upstream-echo.log
          diff -u "$RUNNER_TEMP/cmake-echo-result.txt" "$RUNNER_TEMP/upstream-echo-result.txt"
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" || true
          trap - EXIT

      - name: 运行原版 Skynet TCP 原始事件基线
        working-directory: ${{ runner.temp }}/skynet
        shell: bash
        run: |
          timeout 15s ./skynet examples/tcp-events.conf 2>&1 | tee upstream-tcp-events.log
          grep -F "skyuv TCP 原始事件基线验证通过" upstream-tcp-events.log

      - name: 运行原版 Skynet TCP 控制语义基线
        working-directory: ${{ runner.temp }}/skynet
        shell: bash
        run: |
          timeout 15s ./skynet examples/socket-controls.conf 2>&1 | tee upstream-socket-controls.log
          grep -F "TCP_CONTROL pause_resume" upstream-socket-controls.log
          grep -F "TCP_CONTROL shutdown_close" upstream-socket-controls.log
          grep -F "skyuv TCP 控制语义基线验证通过" upstream-socket-controls.log

      - name: 运行原版 Skynet UDP 事件基线
        working-directory: ${{ runner.temp }}/skynet
        shell: bash
        run: |
          timeout 15s ./skynet examples/udp-events.conf 2>&1 | tee upstream-udp-events.log
          grep -F "UDP_EVENT ipv4_receive address_size=7" upstream-udp-events.log
          grep -F "UDP_EVENT ipv4_reply" upstream-udp-events.log
          grep -F "UDP_EVENT ipv6_receive address_size=19" upstream-udp-events.log
          grep -F "UDP_EVENT ipv6_reply" upstream-udp-events.log
          grep -F "skyuv UDP 原版事件基线验证通过" upstream-udp-events.log

      - name: 对照 libuv 版 TCP 原始事件序列
        shell: bash
        run: |
          timeout 15s "build/${{ matrix.preset }}/src/skyuv_skynet_portable" \
            "build/${{ matrix.preset }}/3rd/skyuv-portable-tcp-events.conf" \
            2>&1 | tee portable-tcp-events.log
          grep -F "skyuv TCP 原始事件基线验证通过" portable-tcp-events.log
          grep -F "TCP_EVENT " "$RUNNER_TEMP/skynet/upstream-tcp-events.log" \
            | sed 's/^.*TCP_EVENT /TCP_EVENT /' | sort >upstream-events.txt
          grep -F "TCP_EVENT " portable-tcp-events.log \
            | sed 's/^.*TCP_EVENT /TCP_EVENT /' | sort >portable-events.txt
          diff -u upstream-events.txt portable-events.txt

      - name: 对照便携版 client.socket 行为
        shell: bash
        run: |
          python3 tests/scripts/client_socket_harness.py \
            "build/${{ matrix.preset }}/src/skyuv_skynet_portable" \
            "build/${{ matrix.preset }}/3rd/skyuv-portable-client-socket.conf" \
            | tee portable-client-socket.txt
          diff -u "$RUNNER_TEMP/upstream-client-socket.txt" portable-client-socket.txt

      - name: 验证 libuv 版 TCP pause/start 语义
        shell: bash
        run: |
          timeout 15s "build/${{ matrix.preset }}/src/skyuv_skynet_portable" \
            "build/${{ matrix.preset }}/3rd/skyuv-portable-socket-controls.conf" \
            2>&1 | tee portable-socket-controls.log
          grep -F "TCP_CONTROL pause_resume" portable-socket-controls.log
          grep -F "TCP_CONTROL shutdown_close" portable-socket-controls.log
          grep -F "skyuv TCP 控制语义基线验证通过" portable-socket-controls.log

      - name: 对照 libuv 版 UDP 事件语义
        shell: bash
        run: |
          timeout 15s "build/${{ matrix.preset }}/src/skyuv_skynet_portable" \
            "build/${{ matrix.preset }}/3rd/skyuv-portable-udp-events.conf" \
            2>&1 | tee portable-udp-events.log
          grep -F "UDP_EVENT ipv4_receive address_size=7" portable-udp-events.log
          grep -F "UDP_EVENT ipv4_reply" portable-udp-events.log
          grep -F "UDP_EVENT ipv6_receive address_size=19" portable-udp-events.log
          grep -F "UDP_EVENT ipv6_reply" portable-udp-events.log
          grep -F "skyuv UDP 原版事件基线验证通过" portable-udp-events.log

      - name: 运行原版 Skynet 启动冒烟测试
        working-directory: ${{ runner.temp }}/skynet
        shell: bash
        run: |
          set +e
          timeout 5s ./skynet examples/config
          status=$?
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi

      - name: 检查第三方源码状态
        shell: bash
        run: |
          test -z "$(git status --short --untracked-files=no)"
          test -z "$(git -C 3rd/skynet status --short --untracked-files=no)"
          test -z "$(git -C 3rd/libuv status --short --untracked-files=no)"
          test -z "$(git -C 3rd/cmocka status --short --untracked-files=no)"

  thread-sanitizer:
    name: Clang ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 配置 ThreadSanitizer
        run: cmake --preset linux-clang-tsan

      - name: 构建并发测试
        run: >-
          cmake --build --preset linux-clang-tsan --target
          skyuv_test_thread skyuv_test_atomic

      - name: 运行并发测试
        run: ctest --preset linux-clang-tsan -R "platform\\.(thread|atomic)"
